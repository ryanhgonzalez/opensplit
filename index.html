<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070714" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splitify" />
    <title>Splitify</title>
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('splitify-v2') || '{}');
          var t = (s.state && s.state.theme) || 'system';
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          }
        } catch (e) {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- ⚠️ TEMPORARY DIAGNOSTIC — remove after testing. Prints real viewport metrics. -->
    <script>
      window.addEventListener('load', function () {
        try {
          var probeB = document.createElement('div');
          probeB.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none;';
          document.body.appendChild(probeB);
          var probeT = document.createElement('div');
          probeT.style.cssText = 'position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none;';
          document.body.appendChild(probeT);
          var sabB = getComputedStyle(probeB).paddingBottom;
          var sabT = getComputedStyle(probeT).paddingTop;
          var vv = window.visualViewport || {};
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;top:110px;left:8px;right:8px;z-index:100000;background:rgba(190,0,255,0.94);color:#fff;font:12px/1.55 ui-monospace,monospace;padding:12px;border-radius:10px;pointer-events:none;white-space:pre;';
          box.textContent =
            'screen:        ' + screen.width + ' x ' + screen.height + '\n' +
            'inner W/H:     ' + window.innerWidth + ' x ' + window.innerHeight + '\n' +
            'visualVP H:    ' + (vv.height || '?') + '\n' +
            'docEl clientH: ' + document.documentElement.clientHeight + '\n' +
            'DPR:           ' + window.devicePixelRatio + '\n' +
            'safe top:      ' + sabT + '\n' +
            'safe bottom:   ' + sabB + '\n' +
            'screen.h-inner:' + (screen.height - window.innerHeight) + '\n' +
            'nav.standalone:' + window.navigator.standalone + '\n' +
            'dm standalone: ' + window.matchMedia('(display-mode: standalone)').matches + '\n' +
            'dm fullscreen: ' + window.matchMedia('(display-mode: fullscreen)').matches;
          document.body.appendChild(box);
        } catch (e) {
          var err = document.createElement('div');
          err.style.cssText = 'position:fixed;top:110px;left:8px;z-index:100000;background:red;color:#fff;font:12px monospace;padding:8px;';
          err.textContent = 'diag error: ' + e;
          document.body.appendChild(err);
        }
      });
    </script>
  </body>
</html>
